name: Linting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13.2"
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check --output-format=github custom_components/biketrax tests

      - run: uv run ruff format --check --diff custom_components/biketrax tests

      # Type checking is not enforced yet, until existing errors are fixed.
      - run: uv run mypy
        continue-on-error: true
