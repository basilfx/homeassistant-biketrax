[project]
name = "homeassistant-biketrax"
version = "2.1.0"
description = "Custom component for the PowUnity BikeTrax integration for Home Assistant."
authors = [{ name = "Bas Stottelaar", email = "basstottelaar@gmail.com" }]
requires-python = ">=3.13.2,<3.14"
dependencies = [
    "homeassistant>=2025.10.0,<2025.11",
    "aiobiketrax==1.3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["env"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.13"
files = ["custom_components/biketrax", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
